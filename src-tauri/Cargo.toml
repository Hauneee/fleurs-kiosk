[package]
name = "fleurs-kiosk"
version = "1.0.0"
description = "Fleurs by Blossoms Craft - Touchscreen Flower Shop Kiosk"
authors = ["Blossoms Craft Team"]
edition = "2021"

[lib]
name = "fleurs_kiosk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
